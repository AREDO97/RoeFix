    <style>
                * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
        }
        a{
            color: black;
        }
        a:hover{
            color: orange;
        }

        .header {
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .nav-menu {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover {
            color: #ff6b35;
        }

        .dropdown {
            cursor: pointer;
        }

        .user-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cart-icon {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b35;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* ===== DESKTOP MEGA MENU ===== */
        .mega-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: none;
            z-index: 999;
            padding: 20px 40px;
            border-top: 1px solid #eee;
        }

        .mega-menu.active {
            display: flex;
            gap: 30px;
        }

        .sidebar {
            width: 200px;
            background: #000;
            color: white;
            padding: 20px;
            min-height: 300px;
           
        }

        .sidebar-item {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: background 0.2s;
            border-radius: 4px;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: #4a4949;
        }

        .content {
            flex: 1;
            display: flex;
            gap: 30px;
            padding: 0 10px;
        }

        .column h4 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }

        .column a {
            display: block;
            color: #555;
            text-decoration: none;
            padding: 8px 0;
            font-size: 14px;
            transition: color 0.2s;
        }

        .column a:hover {
            color: #ff6b35;
        }

        .promo-image {
            width: 300px;
            height: 300px;
            background: url('Images/shoper.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            
        }

        .promo-text {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
        }

        /* ===== MOBILE MENU ===== */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 80%;
            height: 100vh;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1001;
            transition: left 0.3s ease;
            overflow-y: auto;
            padding: 20px;
        }

        .mobile-menu.active {
            left: 0;
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .mobile-menu-list {
            list-style: none;
        }

        .mobile-menu-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 16px;
            color: #333;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-menu {
            display: none;
            padding-left: 20px;
            margin-top: 10px;
        }

        .sub-menu.active {
            display: block;
        }

        .sub-menu-item {
            padding: 8px 0;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-menu-item:hover {
            color: #ff6b35;
        }

        /* ===== PRODUCTS SECTION ===== */
        .products-section {
            padding: 30px 20px;
            background: #fafafa;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 16px;
            color: #ff6b35;
            font-weight: 600;
        }

        /* ===== RESPONSIVE BREAKPOINTS ===== */
        @media (max-width: 768px) {

            .nav-menu,
            .user-actions {
                display: none;
            }

            .mobile-toggle {
                display: block;
            }

            .mega-menu {
                display: none !important;
                /* Hide desktop mega menu on mobile */
            }
        }

        @media (min-width: 769px) {
            .mobile-menu {
                display: none;
            }

            .products-section {
                max-width: 1200px;
                margin: 0 auto;
            }
        }


        #products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Add this inside your <style> tag */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }


    </style>
</head>

            if (!megaMenu.matches(':hover')) megaMenu.classList.remove('active');

        megaMenu.addEventListener('mouseleave', () => megaMenu.classList.remove('active'));

        sidebarItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                sidebarItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                renderCategoryContent(item.dataset.category);
            });
        });

        document.addEventListener('click', (e) => {

        });

                renderProducts(cat);
                mobileMenu.classList.remove('active');
            });
        });

            const items = products[category] || [];

                            entry.target.style.opacity = '1';
                            entry.target.style.transform = 'translateY(0)';
                        }
                    });

    // ===== RENDER PRODUCTS BASED ON URL FRAGMENT =====
    function renderProductsBySubcategory() {
        const hash = window.location.hash.substring(1); // e.g., "t-shirts"
        const titleEl = document.getElementById('category-title');
        const gridEl = document.getElementById('products-grid');

        if (!hash) {
            // No subcategory: show all products (optional)
            titleEl.textContent = "All Products";
            gridEl.innerHTML = '<div class="no-products">Select a category from the homepage.</div>';
            return;
        }

        // Convert kebab-case back to title case for display
        const displayName = hash
            .split('-')
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(' ');

        const products = subcategoryProducts[hash] || [];

        titleEl.textContent = `${displayName} Products`;

        if (products.length === 0) {
            gridEl.innerHTML = `<div class="no-products">No products found for "${displayName}".</div>`;
            return;
        }

        gridEl.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-image" style="background-image: url('${p.img.trim()}')"></div>
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price}</div>
                    </div>
                </div>
            `).join('');
    }

    // Load on page load and when hash changes (e.g., back button)
    window.addEventListener('DOMContentLoaded', renderProductsBySubcategory);
    window.addEventListener('hashchange', renderProductsBySubcategory);


</script>
